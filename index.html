<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="robots" content="noindex,nofollow,noarchive">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="100상점 도우미">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>100상점 붙여넣기 도우미</title>
<style>
  :root { --blue:#1f6feb; --green:#1a7f37; --amber:#9a6700; --red:#cf222e; --bg:#f3f5f8; --line:#dde2ea; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:#1b1f24; font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif; font-size:17px; }
  header { position:sticky; top:0; z-index:5; background:#fff; border-bottom:1px solid var(--line); padding:10px 12px 0; }
  .top { display:flex; align-items:center; gap:8px; }
  .top h1 { font-size:18px; margin:0; flex:1; }
  .clear { border:1px solid #f0b4b4; background:#fff5f5; color:var(--red); font-size:15px; font-weight:700; border-radius:10px; padding:8px 12px; }
  .tabs { display:flex; gap:6px; margin-top:10px; }
  .tab { flex:1; border:0; background:none; font-size:18px; font-weight:800; padding:12px 0; color:#57606a; border-bottom:4px solid transparent; }
  .tab.on { color:var(--blue); border-bottom-color:var(--blue); }
  main { padding:12px 12px 90px; }
  .panel { display:none; } .panel.on { display:block; }
  .big { width:100%; border:0; border-radius:16px; font-size:21px; font-weight:800; padding:18px 12px; color:#fff; background:var(--blue); box-shadow:0 2px 0 rgba(0,0,0,.08); }
  .big:active, .btn:active, .chain:active { transform:scale(.98); }
  textarea { width:100%; margin-top:10px; min-height:78px; max-height:180px; border:1px solid var(--line); border-radius:12px; padding:10px; font-size:16px; background:#fff; resize:vertical; font-family:inherit; }
  textarea.has { min-height:52px; height:52px; color:#57606a; font-size:14px; }
  .row .v.nw { white-space:nowrap; word-break:normal; font-size:17px; }
  .row .v { min-width:0; }
  .row .btn { min-width:62px; padding:12px 10px; }
  .row .btn.sub { min-width:0; padding:12px 8px; }
  .status { margin:12px 2px 6px; font-size:16px; line-height:1.45; }
  .status .ok { color:var(--green); font-weight:700; } .status .warn { color:var(--amber); font-weight:700; } .status .bad { color:var(--red); font-weight:700; }
  .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:4px 12px; margin-top:10px; }
  .card.soft { background:#fafbfc; }
  .row { display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid #eef1f5; }
  .row:last-child { border-bottom:0; }
  .row .k { width:64px; flex:none; font-size:14px; color:#57606a; font-weight:700; }
  .row .v { flex:1; font-size:19px; font-weight:700; word-break:break-all; line-height:1.35; }
  .row .v.empty { color:#b0b7c0; font-weight:500; font-size:16px; }
  .btn { flex:none; border:0; border-radius:12px; background:#e7f0ff; color:var(--blue); font-size:17px; font-weight:800; padding:12px 14px; min-width:70px; }
  .btn.sub { background:#eef1f5; color:#424a53; font-size:15px; min-width:0; padding:12px 10px; }
  .btn.done { background:#dafbe1; color:var(--green); }
  .chain { width:100%; margin-top:12px; border:0; border-radius:16px; background:var(--green); color:#fff; font-size:21px; font-weight:800; padding:18px 12px; }
  .chain small { display:block; font-size:15px; font-weight:600; opacity:.9; margin-top:4px; }
  .all { width:100%; margin-top:10px; border:2px solid var(--blue); background:#fff; color:var(--blue); border-radius:14px; font-size:18px; font-weight:800; padding:14px; }
  .inv { font-size:30px; font-weight:900; letter-spacing:1px; text-align:center; padding:14px 0 4px; font-variant-numeric:tabular-nums; }
  .wing { text-align:center; font-size:16px; color:#424a53; padding:6px 0 12px; }
  .wing b { font-size:22px; color:#1b1f24; }
  .copyinv { width:100%; border:0; border-radius:14px; background:var(--blue); color:#fff; font-size:21px; font-weight:800; padding:16px; margin-bottom:12px; }
  .hint { font-size:16px; padding:10px 0; line-height:1.45; border-bottom:1px solid #eef1f5; } .hint:last-child { border-bottom:0; }
  .muted { color:#6e7781; font-size:14px; line-height:1.5; margin:16px 4px; }
  .toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:#1b1f24; color:#fff; padding:13px 18px; border-radius:24px; font-size:16px; font-weight:700; opacity:0; transition:opacity .2s; pointer-events:none; max-width:90vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; z-index:10; }
  .toast.on { opacity:.95; }
  .hide { display:none !important; }
  .mine { background:#fff; border:1px solid var(--line); border-radius:14px; padding:10px 12px; margin-bottom:10px; font-size:16px; }
  .mine.need { border:2px solid var(--red); background:#fff5f5; }
  .mine .line { display:flex; align-items:center; gap:8px; }
  .mine .line span { flex:1; font-weight:700; }
  .mine input { flex:1; min-width:0; font-size:18px; padding:10px; border:1px solid var(--line); border-radius:10px; font-family:inherit; }
  .mine .msg { font-size:14px; margin-top:6px; color:#57606a; } .mine .msg.bad { color:var(--red); font-weight:700; }
  .note { font-size:14px; color:#57606a; padding:2px 2px 10px; }
  .chain.wait { background:var(--red); }
  .other { display:flex; align-items:center; gap:10px; padding:8px 0; } .other span { flex:1; font-size:19px; font-weight:700; }
  .pager { display:flex; align-items:center; gap:8px; margin-top:12px; position:sticky; top:104px; z-index:4; background:var(--bg); padding:6px 0; }
  .pager button { border:0; border-radius:12px; background:#fff; border:1px solid var(--line); font-size:20px; font-weight:800; padding:10px 0; }
  .pager .nav { width:58px; color:var(--blue); } .pager .nav:disabled { color:#c4c9d0; }
  .pager .pno { flex:1; font-size:19px; color:#1b1f24; }
  .pager .lst { padding:10px 12px; font-size:16px; color:#424a53; }
  .ohead { display:flex; align-items:center; gap:8px; margin-top:6px; }
  .ohead .tt { flex:1; font-size:16px; font-weight:700; color:#424a53; line-height:1.35; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .donebtn { flex:none; border:2px solid var(--green); background:#fff; color:var(--green); border-radius:12px; font-size:17px; font-weight:800; padding:10px 12px; }
  .donebtn.on { background:var(--green); color:#fff; }
  .restart { width:100%; margin-top:6px; border:0; background:none; color:#57606a; font-size:15px; font-weight:700; padding:8px; }
  .del { width:100%; margin-top:14px; border:1px solid #f0b4b4; background:#fff5f5; color:var(--red); border-radius:14px; font-size:16px; font-weight:800; padding:12px; }
  .lhead { display:flex; align-items:center; gap:8px; margin:12px 2px 4px; font-size:16px; font-weight:700; }
  .lhead span { flex:1; }
  .li { display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:0; border-bottom:1px solid #eef1f5; background:none; padding:12px 2px; font-family:inherit; color:#1b1f24; }
  .li:last-child { border-bottom:0; }
  .li .n { width:34px; flex:none; font-size:15px; color:#6e7781; font-weight:700; text-align:right; }
  .li .m { width:24px; flex:none; font-size:18px; }
  .li .x { flex:1; min-width:0; font-size:17px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .li .x small { font-weight:500; color:#57606a; font-size:15px; margin-left:6px; }
  .li.cur { background:#e7f0ff; border-radius:10px; }
  .li.fin .x { color:#8c959f; }
  .match { font-size:16px; padding:10px 0; border-bottom:1px solid #eef1f5; line-height:1.45; }
</style>
</head>
<body>
<header>
  <div class="top"><h1>100상점 붙여넣기 도우미</h1><button class="clear" id="clearBtn" type="button">🗑 지우기</button></div>
  <div class="tabs"><button class="tab on" id="tabO" type="button">📦 주문 복사</button><button class="tab" id="tabT" type="button">🚚 송장 뽑기</button></div>
</header>
<main>
  <section class="panel on" id="pO">
    <div class="mine" id="mine">
      <div class="line" id="mineShow"><span id="mineTxt"></span><button class="btn sub" id="mineEdit" type="button">바꾸기</button><button class="btn sub" id="mineDel" type="button">지우기</button></div>
      <div id="mineForm"><div style="font-weight:700;margin-bottom:6px" id="mineAsk">📞 내 번호 (구매처 연락처 칸에 넣을 대표님 번호)</div>
        <div class="line"><input id="mineIn" type="tel" inputmode="numeric" autocomplete="tel" placeholder="예) 010-1234-5678"><button class="btn" id="mineSave" type="button">저장</button></div></div>
      <div class="msg" id="mineMsg"></div>
    </div>
    <button class="big" id="pasteO" type="button">📋 주문 붙여넣기</button>
    <textarea id="inO" placeholder="윙 주문을 복사한 뒤 위 버튼을 누르세요. 여러 개를 한 번에 복사해도 돼요.&#10;안 되면 여기를 길게 눌러 '붙여넣기' 하세요." autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
    <button class="all hide" id="addO" type="button">➕ 이 글로 주문 추가</button>
    <div class="status" id="stO"></div>
    <div class="pager hide" id="pager"><button class="nav" id="prevO" type="button" aria-label="앞 주문">◀</button><button class="pno" id="pageNo" type="button"></button><button class="nav" id="nextO" type="button" aria-label="다음 주문">▶</button><button class="lst" id="listBtn" type="button">📑 목록</button></div>
    <div id="listV" class="hide">
      <div class="lhead"><span id="listSum"></span><button class="btn sub" id="clrDone" type="button">완료한 것 지우기</button></div>
      <div class="card" id="listRows"></div>
    </div>
    <div id="outO" class="hide">
      <div class="ohead"><div class="tt" id="oTitle"></div><button class="donebtn" id="doneBtn" type="button">⬜ 완료</button></div>
      <div class="status" id="stP"></div>
      <div class="note hide" id="oInv"></div>
      <button class="chain" id="chain" type="button"></button>
      <button class="restart hide" id="restart" type="button">↺ 받는 분부터 다시 복사</button>
      <div class="card" id="rowsO"></div>
      <div class="note" id="custNote"></div>
      <button class="all" id="allBtn" type="button">📄 전체 복사 (받는 분·내 번호·주소·메모)</button>
      <div class="card soft" id="rowsP"></div>
      <button class="del" id="delOne" type="button">🗑 이 주문만 지우기</button>
    </div>
  </section>
  <section class="panel" id="pT">
    <button class="big" id="pasteT" type="button">📋 송장 붙여넣기</button>
    <textarea id="inT" placeholder="구매처 배송조회·주문내역 화면이나 택배 문자를 복사한 뒤 위 버튼을 누르세요. 여러 개를 한 번에 복사해도 돼요.&#10;안 되면 여기를 길게 눌러 '붙여넣기' 하세요." autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
    <button class="all hide" id="addT" type="button">➕ 이 글로 송장 찾기</button>
    <div class="status" id="stT"></div>
    <div class="pager hide" id="pagerT"><button class="nav" id="prevT" type="button" aria-label="앞 송장">◀</button><button class="pno" id="pageNoT" type="button"></button><button class="nav" id="nextT" type="button" aria-label="다음 송장">▶</button><button class="lst" id="listBtnT" type="button">📑 목록</button></div>
    <div id="listVT" class="hide">
      <div class="lhead"><span id="listSumT"></span></div>
      <div class="card" id="listRowsT"></div>
    </div>
    <div id="outT" class="hide">
      <div class="ohead"><div class="tt" id="tTitle"></div><button class="donebtn" id="doneT" type="button">⬜ 윙 입력 완료</button></div>
      <div class="card" id="invCard"></div>
    </div>
    <div id="looseV" class="hide">
      <div class="lhead"><span id="looseSum"></span></div>
      <div class="note" id="looseNote"></div>
      <div class="card" id="looseRows"></div>
    </div>
  </section>
  <div class="status hide" id="fullWarn"><span class="bad">⚠️ 휴대폰 저장 공간이 꽉 차서 저장이 안 돼요.</span> 완료한 주문을 지우거나 휴대폰 공간을 비워 주세요.</div>
  <p class="muted" id="privacy">주문은 이 휴대폰에만 저장돼요. 인터넷으로 보내지 않아요.<br>넣은 지 하루가 지나면 저절로 지워져요 (완료한 주문도). 🗑로 바로 지울 수도 있어요.<br>송장도 똑같이 하루 뒤 지워져요. 내 번호는 이 휴대폰에만 남아요.</p>
</main>
<div class="toast" id="toast"></div>
<script>
/* 100상점 붙여넣기 도우미 — 글자 분석 (네트워크 호출 없음) */
(function (root) {
  'use strict';
  const clean = (s) => (s == null ? '' : String(s)).replace(/\u00a0|\u200b|\ufeff/g, ' ').replace(/[ \t]+/g, ' ').trim();
  const compact = (s) => clean(s).replace(/[\s:：*★※■□●○▶·\-]/g, '').replace(/(필수|선택)$/, '');
  const noParen = (s) => s.replace(/\([^)]*\)|\[[^\]]*\]/g, '');

  // ---------------- 주문 ----------------
  const HEADER_WORDS = ['주문번호', '주문자명', '주문자', '주문일시', '주문일', '결제일시', '결제일', '수취인명', '수취인', '수령인', '수령자', '받는분', '받는사람',
    '연락처', '안심번호', '전화번호', '휴대폰번호', '휴대폰', '배송주소', '배송지주소', '배송지', '기본주소', '상세주소', '주소', '우편번호', '배송진행상태', '배송상태',
    '등록상품명', '노출상품명', '상품명', '옵션명', '옵션', '상품정보', '구매수량', '주문수량', '수량', '결제금액', '금액', '판매가', '배송비', '배송메모', '배송메세지',
    '배송메시지', '배송요청사항', '요청사항', '묶음배송번호', '배송유형', '운송장번호', '송장번호', '택배사', '출고예정일', '개인통관고유부호', '통관고유부호', '상태', '선택', '전체', '정보', '이름', '명', '복사', '변경', '수정'];
  const HW_RE = new RegExp('(' + HEADER_WORDS.slice().sort((a, b) => b.length - a.length).join('|') + ')', 'g');
  function isHeaderish(v) {
    const c = clean(v).replace(/[\s:：*★※\/|·,.()\[\]{}<>\-~_]/g, '');
    if (!c) return true;
    return c.replace(HW_RE, '') === '';
  }
  const EXAMPLE_RE = /^(예\s*\)|예\s*:|예시)|^\s*[-–—]+\s*$|^(없음|입력|선택|선택안함|해당없음)$|입력해\s*주세요|입력하세요/;
  const badValue = (v) => !clean(v) || isHeaderish(v) || EXAMPLE_RE.test(clean(v));

  const LABELS = {
    orderNo: { re: /^(주문번호|주문번호\/?묶음배송번호)$/, score: () => 1 },
    product: { re: /^(노출상품명|상품명|등록상품명|등록상품명\/노출상품명|등록상품명노출상품명|노출상품명\/등록상품명|상품명\/옵션|상품정보|상품명옵션|주문상품)$/, score: (t) => (/^노출/.test(t) ? 4 : /^상품명/.test(t) ? 3 : /^등록/.test(t) ? 2 : 1) },
    option: { re: /^(옵션|옵션명|옵션정보|선택옵션)$/, score: () => 1 },
    qty: { re: /^(수량|구매수량|주문수량)$/, score: () => 1 },
    name: { re: /^(수취인|수령인|수령자|받는분|받으시는분|받는사람|수하인|받는이)(명|이름|성명)?$/, score: () => 1 },
    phone: {
      re: /^(수취인|수령인|받는분|받는사람|받는이)?(연락처|연락처1|전화번호|휴대폰|휴대폰번호|휴대전화|휴대전화번호|핸드폰|안심번호|전화|휴대폰\/전화|연락처\/안심번호|연락처\(안심번호\))$/,
      score: (t) => (/^(수취인|수령인|받는)/.test(t) ? 5 : 2) + (/안심/.test(t) ? 1 : 0) + (/2$/.test(t) ? -3 : 0)
    },
    zip: { re: /^(수취인|배송지)?(우편번호|우편)$/, score: () => 1 },
    addr: {
      re: /^(수취인|수령인|받는분|받는사람|배송지)?(주소|배송주소|배송지|배송지주소|주소지|기본주소|도로명주소|배송주소지)$/,
      score: (t) => (/^(수취인|수령인|받는|배송)/.test(t) ? 3 : 1) + (/도로명/.test(t) ? 1 : 0)
    },
    addr2: { re: /^(상세주소|나머지주소)$/, score: () => 1 },
    memo: { re: /^(배송메모|배송메세지|배송메시지|배송요청사항|요청사항|배송시요청사항|배송요청|배송메모\/요청사항|배송메시지\/요청사항|배송시메모)$/, score: () => 1 },
    customs: { re: /^(개인통관고유부호|통관고유부호|개인통관부호|통관부호|개인통관번호)$/, score: () => 1 }
  };
  function labelMatch(text) {
    const c = compact(text);
    if (!c || c.length > 16) return null;
    for (const v of [c, noParen(c)]) for (const key of Object.keys(LABELS)) if (v && LABELS[key].re.test(v)) return { key, t: v };

  const FIELDS = [['name', '받는 분'], ['phone', '연락처'], ['zip', '우편번호'], ['addr', '주소'], ['addr2', '상세주소'], ['memo', '배송메모'], ['customs', '통관부호']];
  const STEPS = [['name', '받는 분'], ['phone', '연락처(내 번호)'], ['addr', '주소'], ['addr2', '상세주소'], ['memo', '배송메모']];

  });
  $('restart').addEventListener('click', () => { const o = curO(); if (o) { o.step = 0; save(); renderChain(); } });
  $('doneBtn').addEventListener('click', () => { const o = curO(); if (!o) return; setDone(o, !o.done); toast(o.done ? '✅ 완료로 표시했어요' : '완료 표시를 뺐어요'); renderO(); });
  $('rowsO').addEventListener('click', (e) => { if (e.target.id === 'needMine') { askMine(); return; } onRowCopy(e); });
  $('rowsP').addEventListener('click', onRowCopy);
  function onRowCopy(e) {
    const b = e.target.closest('button[data-k]'); if (!b) return;
    const k = b.dataset.k; const lab = (FIELDS.find((f) => f[0] === k) || [0, k === 'phoneDigits' ? '내 번호 숫자' : ''])[1];
    copy(valOf(k), lab || valOf(k), b);
    const o = curO(), ci = chainList.findIndex((x) => x[0] === k);
    if (o && ci >= 0 && ci === (o.step || 0)) { o.step++; save(); renderChain(); }
  }
  $('allBtn').addEventListener('click', () => { if (!buyer) return; if (!buyer.phone) toast('내 번호가 없어서 연락처는 빼고 복사해요'); copy(MH.orderAllText(buyer), '받는 분·내 번호·주소·메모 전체'); });
  $('prevO').addEventListener('click', () => step(-1));
  $('nextO').addEventListener('click', () => step(1));
  $('pageNo').addEventListener('click', () => { listOpen = !listOpen; renderO(); });
  $('listBtn').addEventListener('click', () => { listOpen = !listOpen; renderO(); });
  $('listRows').addEventListener('click', (e) => { const b = e.target.closest('button[data-id]'); if (b) go(b.dataset.id); });
  $('clrDone').addEventListener('click', () => { const n = S.list.filter((o) => o.done).length; S.list = S.list.filter((o) => !o.done); save(); renderO(); toast('완료한 주문 ' + n + '개를 지웠어요'); });
  $('delOne').addEventListener('click', () => {
    const b = $('delOne'), i = idx(S.cur); if (i < 0) return;
    if (!b.dataset.arm) { b.dataset.arm = '1'; b.textContent = '한 번 더 누르면 이 주문을 지워요'; setTimeout(() => { delete b.dataset.arm; b.textContent = '🗑 이 주문만 지우기'; }, 3000); return; }
    delete b.dataset.arm; b.textContent = '🗑 이 주문만 지우기';
    const name = (S.list[i].d.name || "");
    S.list.splice(i, 1); S.cur = S.list.length ? S.list[Math.min(i, S.list.length - 1)].id : null;
    save(); renderO(); toast(name + ' 주문을 지웠어요');
  });
  // 밀어서 넘기기
  function swipe(el, fn) {
    let x0 = null, y0 = 0;
    el.addEventListener('touchstart', (e) => { const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; }, { passive: true });
    el.addEventListener('touchend', (e) => { if (x0 == null) return; const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0; x0 = null; if (Math.abs(dx) > 60 && Math.abs(dy) < 50) fn(dx < 0 ? 1 : -1); }, { passive: true });
  }
  swipe($('outO'), step);

  // ---------- 송장 ----------
  let listOpenT = false;
  const withInv = () => S.list.filter((o) => o.inv);
  const WHY = { nomatch: '맞는 주문이 없어요', many: '맞는 주문이 여러 개예요', guess: '이름표 없는 숫자예요', multi: '한 글에 송장이 여러 개예요', taken: '그 주문엔 이미 다른 송장이 있어요', noorder: '넣어 둔 주문이 없어요' };
  function trackFrom(text) {
    if (!String(text || '').trim()) return;
    const r = MH.applyTracking(S.list, S.loose, text);
    S.list = r.list; S.loose = r.loose;
    const msg = [];
    if (r.paired.length) { S.curT = r.paired[0]; listOpenT = false; msg.push('<span class="ok">✅ 송장 ' + r.paired.length + '개를 주문에 넣었어요.</span> (이름·동호수가 맞는 것만)'); }
    if (r.unmatched.length) msg.push('<span class="warn">⚠️ 못 찾음 ' + r.unmatched.length + '개</span> — 어느 주문인지 확실하지 않아 짝을 안 지었어요. 아래에서 확인해 주세요.');
    if (r.dup) msg.push('ℹ️ 이미 넣은 송장 ' + r.dup + '개는 뺐어요.');
    if (!r.found) msg.push(r.why === 'pre' ? '<span class="warn">⚠️ 아직 배송 전 화면 같아요 (결제완료·상품준비중).</span> 송장이 나온 뒤 다시 붙여넣어 주세요.'
      : r.why === 'dropped' ? '<span class="bad">⚠️ 송장번호로 보기 어려운 숫자만 있어요.</span> (주문번호·전화번호·자릿수가 안 맞는 숫자는 뺐어요)'
        : '<span class="bad">⚠️ 송장번호를 못 찾았어요.</span> 배송조회 화면에서 받는 분·택배사·송장번호가 보이게 복사해 주세요.');
    $('inT').value = ''; $('addT').classList.add('hide');
    save(); renderO(); $('stT').innerHTML = msg.join('<br>');
    // 짝 지은 송장이 딱 하나면 바로 복사
    if (r.paired.length === 1 && !r.unmatched.length) { const o = S.list[idx(r.paired[0])]; copy(o.inv.no, '송장번호 ' + o.inv.no).then((ok) => { const b = $('copyInv'); if (ok && b) { b.classList.add('done'); b.textContent = '✓ 복사됨 · 윙 송장칸에 붙여넣으세요'; } }); }
  }
  function renderT() {
    const L = withInv(), n = L.length;
    if (n && !L.some((o) => o.id === S.curT)) S.curT = L[0].id;
    const i = L.findIndex((o) => o.id === S.curT), o = L[i];
    $('pasteT').textContent = n || S.loose.length ? '📋 송장 더 붙여넣기' : '📋 송장 붙여넣기';
    $('pagerT').classList.toggle('hide', !n);
    $('outT').classList.toggle('hide', !n || listOpenT);
    $('listVT').classList.toggle('hide', !n || !listOpenT);
    if (n) {
      const doneN = L.filter((x) => x.inv.done).length;
      $('pageNoT').textContent = (i + 1) + ' / ' + n + (doneN ? '  ·  ✅' + doneN : '');
      $('prevT').disabled = i <= 0; $('nextT').disabled = i >= n - 1;
      $('listBtnT').textContent = listOpenT ? '✕ 닫기' : '📑 목록';
      if (listOpenT) {
        $('listSumT').textContent = '송장 ' + n + '개 (주문 ' + S.list.length + '개 중) · 윙 입력 완료 ' + doneN + '개';
        $('listRowsT').innerHTML = L.map((x, k) => '<button class="li' + (x.id === S.curT ? ' cur' : '') + (x.inv.done ? ' fin' : '') + '" type="button" data-id="' + esc(x.id) + '"><span class="n">' + (k + 1) + '</span><span class="m">' + (x.inv.done ? '✅' : '⬜') + '</span><span class="x">' + esc((x.d.name || "")) + '<small>' + esc(x.inv.wing || x.inv.car || '택배사 모름') + ' ·' + esc(x.inv.no.slice(-4)) + '</small></span></button>').join('');
      } else {
        const v = o.inv, on = S.list.findIndex((x) => x.id === o.id) + 1;
        $('tTitle').textContent = '주문 ' + on + '번 · ' + titleOf(o);
        $('doneT').classList.toggle('on', !!v.done); $('doneT').textContent = v.done ? '✅ 윙 입력 완료' : '⬜ 윙 입력 완료';
        $('invCard').innerHTML = '<div class="inv" id="invNo">' + esc(fmtInv(v.no)) + '</div>' +
          '<div class="wing">' + (v.wing ? '윙에서 고를 택배사: <b id="wingName">' + esc(v.wing) + '</b>' : v.car ? '택배사: <b>' + esc(v.car) + '</b><br>윙 목록 이름은 확실하지 않아요. 윙에서 직접 골라 주세요.' : '<span style="color:var(--amber);font-weight:700">⚠️ 택배사를 못 찾았어요.</span> 윙에서 직접 골라 주세요.') + '</div>' +
          '<button class="copyinv" id="copyInv" type="button">송장번호 복사</button>' +
          '<div class="hint">✅ 받는 분 이름과 동·호수(주소)가 맞아서 이 주문에 넣었어요.</div>';
      }
    }
    // 못 찾음
    const lo = S.loose;
    $('looseV').classList.toggle('hide', !lo.length);
    $('looseSum').textContent = '⚠️ 못 찾음 ' + lo.length + '개';
    $('looseNote').textContent = S.list.length ? '어느 주문인지 확실하지 않아서 짝을 안 지었어요. 윙에서 받는 분을 직접 확인하고 쓰세요.' : '주문을 넣지 않아서 짝은 안 지었어요. 받는 분을 확인하고 쓰세요.';
    $('looseRows').innerHTML = lo.map((x) => '<div class="match"><div style="font-size:21px;font-weight:900">' + esc(fmtInv(x.inv.no)) + '</div><div>' + esc(x.inv.wing || x.inv.car || '택배사 모름') + (x.who ? ' · 받는 분 ' + esc(x.who) : '') + ' · <span style="color:var(--amber)">' + esc(WHY[x.why] || '') + '</span></div>' +
      '<div class="line" style="display:flex;gap:8px;margin-top:6px"><button class="btn" type="button" data-cp="' + esc(x.id) + '" data-t="복사">복사</button><button class="btn sub" type="button" data-rm="' + esc(x.id) + '">지우기</button></div></div>').join('');
  }
  const curT = () => S.list[idx(S.curT)] || null;
  function stepT(dir) { const L = withInv(), i = L.findIndex((o) => o.id === S.curT) + dir; if (i >= 0 && i < L.length) { S.curT = L[i].id; listOpenT = false; save(); renderT(); toast((i + 1) + ' / ' + L.length + ' ' + (L[i].d.name || "")); } }
  $('invCard').addEventListener('click', (e) => {
    const b = e.target.closest('button'); const o = curT(); if (!b || !o) return;
    if (b.id === 'copyInv') copy(o.inv.no, '송장번호 ' + o.inv.no).then((ok) => { if (ok) { b.classList.add('done'); b.textContent = '✓ 복사됨 · 윙 송장칸에 붙여넣으세요'; } });
  });
  $('doneT').addEventListener('click', () => {
    const o = curT(); if (!o) return;
    o.inv.done = !o.inv.done; save();
    if (o.inv.done) { toast('✅ 윙 입력 완료'); const L = withInv(), nx = L.find((x) => !x.inv.done); if (nx) S.curT = nx.id; }
    renderT();
  });
  $('prevT').addEventListener('click', () => stepT(-1));
  $('nextT').addEventListener('click', () => stepT(1));
  $('pageNoT').addEventListener('click', () => { listOpenT = !listOpenT; renderT(); });
  $('listBtnT').addEventListener('click', () => { listOpenT = !listOpenT; renderT(); });
  $('listRowsT').addEventListener('click', (e) => { const b = e.target.closest('button[data-id]'); if (b) { S.curT = b.dataset.id; listOpenT = false; save(); renderT(); } });
  $('looseRows').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.cp) { const x = S.loose.find((y) => y.id === b.dataset.cp); if (x) copy(x.inv.no, '송장번호 ' + x.inv.no, b); }
    if (b.dataset.rm) { S.loose = S.loose.filter((y) => y.id !== b.dataset.rm); save(); renderT(); }
  });
  swipe($('outT'), stepT);
  $('pasteT').addEventListener('click', () => pasteInto($('inT'), () => trackFrom($('inT').value)));
  $('addT').addEventListener('click', () => trackFrom($('inT').value));
  let toT = 0;
  $('inT').addEventListener('input', (e) => {
    clearTimeout(toT);
    if (e.inputType === 'insertFromPaste') toT = setTimeout(() => trackFrom($('inT').value), 250);
    else $('addT').classList.toggle('hide', !$('inT').value.trim());
  });

  // ---------- 다 지우기 · 시간 ----------
  function wipe(msg) {
    S = { list: [], loose: [], cur: null, curT: null }; listOpen = listOpenT = false;
    $('inO').value = ''; $('inT').value = ''; $('stO').innerHTML = ''; $('stT').innerHTML = '';
    save(); renderO(); if (msg) toast(msg);
  }
  $('clearBtn').addEventListener('click', () => {
    const b = $('clearBtn');
    if (!b.dataset.arm) { b.dataset.arm = '1'; b.textContent = '한 번 더 누르면 다 지워요'; setTimeout(() => { delete b.dataset.arm; b.textContent = '🗑 지우기'; }, 3000); return; }
    delete b.dataset.arm; b.textContent = '🗑 지우기';
    wipe('주문·송장을 다 지웠어요');
  });
  const tick = () => { const n0 = S.list.length + S.loose.length; load(); const gone = n0 - S.list.length - S.loose.length; if (gone > 0) toast('하루 지난 주문·송장 ' + gone + '개를 지웠어요'); renderO(); };
  setInterval(tick, 60 * 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { load(); renderO(); } });
  window.addEventListener('pageshow', () => { load(); renderO(); });

  function showTab(t) {
    $('tabO').classList.toggle('on', t === 'O'); $('tabT').classList.toggle('on', t === 'T');
    $('pO').classList.toggle('on', t === 'O'); $('pT').classList.toggle('on', t === 'T');
    window.scrollTo(0, 0);
  }
  $('tabO').addEventListener('click', () => showTab('O'));
  $('tabT').addEventListener('click', () => showTab('T'));
  load(); renderMine(); renderO(); save();
  window.__mh = { showTab, renderO, wipe, tick, state: () => JSON.parse(JSON.stringify(S)) };
})();

</script>
</body>
</html>
